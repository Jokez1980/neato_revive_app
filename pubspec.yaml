name: vacuula
description: Neato Revive App - remote control for Neato vacuums via your own Vacuula server.
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# App icon (original artwork, no Vacuula or Neato logos). Generated by setup.sh
# (dart run flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#16324F"
  adaptive_icon_foreground: "assets/icon/foreground.png"
